<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Cohort 8</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #071a2e, #123f63);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      color: white;
    }

    .form-container {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.08);
      padding: 45px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .intro {
      color: #d6e3ec;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 7px;
      border: none;
      margin-bottom: 20px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      outline: 2px solid #38d9a9;
    }

    button {
      width: 100%;
      background: #38d9a9;
      color: #071a2e;
      border: none;
      padding: 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #55e6bb;
      transform: translateY(-2px);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #d6e3ec;
      text-decoration: none;
    }

    .back:hover {
      color: #38d9a9;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <div class="badge">🚀 Cohort 8 Capstone Project</div>

    <h1>Join Cohort 8</h1>

    <p class="intro">
      Complete the form below to register and receive the next steps
      for the Cohort 8 Capstone Project.
    </p>

    <form id="registrationForm">

  <label for="name">Full Name</label>
  <input
    type="text"
    id="name"
    name="name"
    placeholder="Enter your full name"
    required
  >

  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    name="email"
    placeholder="Enter your email address"
    required
  >

  <label for="phone">WhatsApp Number</label>
  <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="e.g. +234 801 234 5678"
    required
  >

  <label for="interest">Digital Marketing Interest</label>

  <select id="interest" name="interest" required>
    <option value="">Select an option</option>
    <option>Social Media Marketing</option>
    <option>Content Marketing</option>
    <option>Email Marketing</option>
    <option>SEO</option>
    <option>Paid Advertising</option>
    <option>Other</option>
  </select>

  <button type="submit">
    REGISTER NOW →
  </button>

</form>

    <a href="index.html" class="back">
      ← Back to Landing Page
    </a>

  </div>

  <!-- EmailJS Browser SDK -->
<script
  type="text/javascript"
  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>

<script>
  // Initialize EmailJS
  emailjs.init({
    publicKey: "vSsSjTVvMOfDXco3E"
  });

  const form = document.getElementById("registrationForm");
  const submitButton = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;

    // Save the person's name for the Thank You page
    localStorage.setItem("cohort8Name", name);

    // Prevent double clicking while email is being sent
    submitButton.disabled = true;
    submitButton.textContent = "SENDING...";

    emailjs.sendForm(
      "service_t79324y",
      "template_dz2kdoq",
      this
    )
    .then(function(response) {

      console.log("Email sent successfully:", response);

      // Only show Thank You page after the email was sent
      window.location.href = "thank-you.html";

    })
    .catch(function(error) {

      console.error("Email failed:", error);

      alert(
        "Registration could not be completed. Please check your internet connection and try again."
      );

      submitButton.disabled = false;
      submitButton.textContent = "REGISTER NOW →";
    });
  });
</script>

</body>
</html>
